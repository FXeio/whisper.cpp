services:
  whisper:
    build: .
    container_name: whisper
    environment:
      - WHISPER_MODEL=tiny
      - WHISPER_THREADS=4
    volumes:
      - whisper-models:/models
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  whisper-models:
